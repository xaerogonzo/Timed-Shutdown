name: tests

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # shell: powershell is Windows PowerShell 5.1 - the runtime the app targets,
      # and STA by default, which the WPF markup tests require. Do not switch to
      # pwsh: it resolves a different module path and is a different runtime.
      - name: Install Pester (pinned)
        shell: powershell
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Scope CurrentUser -Force | Out-Null
          # RequiredVersion, never MinimumVersion. Asking for "5.0 or newer" once
          # installed Pester 6, whose breaking changes (root-level BeforeEach
          # rejected) silently failed a whole test file.
          Install-Module Pester -RequiredVersion 6.1.0 -Scope CurrentUser -Force -SkipPublisherCheck
          Get-Module -ListAvailable Pester | Select-Object Version, Path | Format-Table -AutoSize

      - name: Verify the bundle builds and keeps its BOM
        shell: powershell
        run: .\build.ps1

      # Non-blocking BY DESIGN, and staying that way. This is an older
      # PowerShell scriptbase; the analyzer's stylistic rules would demand
      # rewriting code that works. The value here is the BASELINE count -- once
      # recorded, a later change can gate on "no new warnings" against it, which
      # is the useful signal. "Make the analyzer green" is not.
      #
      # Pinned, like Pester above, for the same reason: a baseline is meaningless
      # against a moving analyzer version, because a new release can add rules and
      # shift the count with no source change.
      - name: PSScriptAnalyzer (baseline, non-blocking)
        shell: powershell
        continue-on-error: true
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force -SkipPublisherCheck
          Import-Module PSScriptAnalyzer
          $v = (Get-Module PSScriptAnalyzer).Version

          # PSDSC* is Desired State Configuration guidance -- irrelevant to a WPF
          # tray utility, and 7 of its rules crash on tests\Source.Tests.ps1.
          $exclude = @('PSDSC*')

          # dist\ is GENERATED from src\, so analysing it would report every
          # finding twice.
          $targets = @(Get-ChildItem -Path src, tests -Recurse -Filter *.ps1 -File) +
                     @(Get-Item build.ps1)

          # Per FILE, not per path, and each one guarded. PSScriptAnalyzer 1.25.0
          # throws "Reference Position should begin before start Position of Range"
          # on tests\Source.Tests.ps1, and a single -Path over the tree loses the
          # whole baseline to that one file. Analysing individually costs nothing
          # and degrades to "20 of 21 files" instead of "no result at all".
          $found = @(); $skipped = @()
          foreach ($t in $targets) {
              try {
                  $found += @(Invoke-ScriptAnalyzer -Path $t.FullName -ExcludeRule $exclude -ErrorAction Stop)
              } catch {
                  $skipped += [pscustomobject]@{ File = $t.Name; Reason = $_.Exception.Message }
              }
          }

          $found | Group-Object RuleName | Sort-Object Count -Descending |
              Select-Object Count, Name | Format-Table -AutoSize

          # A step that cannot fail the build must SHOUT, or a crash in here looks
          # identical to a clean run -- which is the exact silent-failure shape
          # this project has already shipped three times. Annotations surface on
          # the PR without anyone opening the log.
          foreach ($s in $skipped) {
              Write-Host "::warning file=$($s.File)::PSScriptAnalyzer $v could not analyse this file, so it is NOT in the baseline: $($s.Reason)"
          }

          $e = @($found | Where-Object Severity -eq 'Error').Count
          $w = @($found | Where-Object Severity -eq 'Warning').Count
          $i = @($found | Where-Object Severity -eq 'Information').Count
          Write-Host ""
          Write-Host "PSScriptAnalyzer $v baseline: $e errors, $w warnings, $i information"
          Write-Host "  files analysed: $($targets.Count - $skipped.Count) of $($targets.Count)"
          if ($skipped) { Write-Host "  NOT analysed:   $(($skipped.File) -join ', ')" }

      - name: Run tests
        shell: powershell
        run: .\tests\Invoke-Tests.ps1 -CI
